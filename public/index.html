<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniLang Formatter</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- App Styles -->
  <link rel="stylesheet" href="/static/styles.css">
  <!-- React + ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for in-browser JSX transform -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LANGUAGE = 'python';          // project scope: Python only
    const FILE_EXT = '.py';
    const INDENT_SIZE = 4;              // fixed style rule
    const SAMPLE_CODE = `# greet the user\nx=10\nname="Ana"\nif x>5:\n  print("big "+name)\nelse:\n        print("small")\nwhile x>0:\n x=x-1`;

    function App() {
      const [code, setCode]                 = useState(SAMPLE_CODE);
      const [formattedCode, setFormatted]   = useState('');
      const [indentStyle]                   = useState('spaces');
      const [maxLine]                       = useState(80);
      const [theme, setTheme]               = useState('dark');
      const [isFormatting, setFormatting]   = useState(false);
      const [errorInfo, setError]           = useState(null);
      const [metrics, setMetrics]           = useState({
        commentsPreserved: 0, executionTimeMs: 0,
        originalLines: 0, formattedLines: 0,
        lexerStatus: '—', parserStatus: '—'
      });
      const [toast, setToast]               = useState('');
      const inputGutter  = useRef(null);
      const outputGutter = useRef(null);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        handleFormat(SAMPLE_CODE);
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); handleFormat(); }
          if ((e.ctrlKey || e.metaKey) && e.key === 'k')    { e.preventDefault(); handleClear(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [code]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };

      const handleFormat = async (
        targetCode = code
      ) => {
        setFormatting(true);
        setError(null);
        try {
          const res  = await fetch('/api/format', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: targetCode, language: LANGUAGE,
              indent_size: INDENT_SIZE, indent_style: indentStyle,
              max_line_length: maxLine
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setFormatted(data.formatted_code);
            setMetrics({
              commentsPreserved: data.comments_preserved ?? 0,
              executionTimeMs:   data.execution_time_ms  ?? 0,
              originalLines:     data.original_lines     ?? 0,
              formattedLines:    data.formatted_lines    ?? 0,
              lexerStatus:       data.lexer_status       || 'OK',
              parserStatus:      data.parser_status      || 'OK'
            });
          } else {
            setError({
              type:       data.error?.type    || 'Error',
              message:    data.user_message   || data.error?.message || 'Formatting failed.',
              suggestion: data.error?.suggestion || ''
            });
          }
        } catch {
          setError({
            type: 'Connection error',
            message: 'Could not reach Flask backend. Make sure "python backend/app.py" is running.',
            suggestion: 'Start the backend server first.'
          });
        } finally {
          setFormatting(false);
        }
      };

      const handleClear = () => {
        setCode(''); setFormatted(''); setError(null);
        showToast('Editor cleared');
      };

      const handleCopy = async () => {
        if (!formattedCode) { showToast('Nothing to copy'); return; }
        try { await navigator.clipboard.writeText(formattedCode); showToast('Copied!'); }
        catch { showToast('Copy failed'); }
      };

      const handlePaste = async () => {
        try { const t = await navigator.clipboard.readText(); setCode(t); handleFormat(t); showToast('Pasted!'); }
        catch { showToast('Clipboard denied'); }
      };

      const handleDownload = () => {
        const ext  = FILE_EXT;
        const blob = new Blob([formattedCode || code], { type: 'text/plain' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = `formatted_code${ext}`; a.click();
        URL.revokeObjectURL(url);
        showToast(`Downloaded formatted_code${ext}`);
      };

      const handleTabInTextarea = (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const ta    = e.target;
          const start = ta.selectionStart;
          const end   = ta.selectionEnd;
          const sp    = ' '.repeat(INDENT_SIZE);
          const next  = code.substring(0, start) + sp + code.substring(end);
          setCode(next);
          setTimeout(() => { ta.selectionStart = ta.selectionEnd = start + INDENT_SIZE; }, 0);
        }
      };

      const syncInputScroll  = (e) => { if (inputGutter.current)  inputGutter.current.scrollTop  = e.target.scrollTop; };
      const syncOutputScroll = (e) => { if (outputGutter.current) outputGutter.current.scrollTop = e.target.scrollTop; };

      const inLines  = Math.max(code.split('\n').length, 1);
      const outLines = Math.max(formattedCode ? formattedCode.split('\n').length : 1, 1);

      return (
        <div className="app-container">
          {/* Header */}
          <header className="app-header">
            <div className="header-brand">
              <div className="brand-row">
                <svg className="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <h1 className="brand-title">MiniLang Formatter</h1>
              </div>
              <p className="brand-subtitle">Paste messy code. Get consistent code. Comments stay.</p>
            </div>

            <div className="header-controls">
              {/* Format */}
              <button className="btn btn-format" onClick={() => handleFormat()} disabled={isFormatting}>
                {isFormatting ? 'Formatting…' : 'Format'}
              </button>

              {/* Download */}
              <button className="btn btn-secondary" onClick={handleDownload}>
                Download {FILE_EXT}
              </button>

              {/* Theme Toggle */}
              <button className="btn btn-secondary btn-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title="Toggle theme">
                {theme === 'dark'
                  ? <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" strokeWidth="2"/><path strokeWidth="2" strokeLinecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                  : <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                }
              </button>
            </div>
          </header>

          {/* Dual Editor */}
          <main className="editor-workspace">
            {/* Input */}
            <section className="editor-card">
              <div className="editor-header">
                <span className="editor-title">SOURCE (MESSY)</span>
                <div className="editor-actions">
                  <button className="btn-action" onClick={handlePaste}>Paste</button>
                  <button className="btn-action" onClick={handleClear}>Clear</button>
                </div>
              </div>
              <div className="editor-body">
                <div className="line-numbers" ref={inputGutter}>
                  {Array.from({ length: inLines }, (_, i) => (
                    <div key={i} className="line-number-item">{i + 1}</div>
                  ))}
                </div>
                <textarea
                  className="code-textarea"
                  value={code}
                  onChange={e => setCode(e.target.value)}
                  onKeyDown={handleTabInTextarea}
                  onScroll={syncInputScroll}
                  placeholder="Paste or type unformatted code here…"
                  spellCheck="false"
                  autoCapitalize="off"
                  autoComplete="off"
                />
              </div>
            </section>

            {/* Output */}
            <section className="editor-card output-card">
              <div className="editor-header">
                <span className="editor-title">FORMATTED OUTPUT</span>
                <div className="editor-actions">
                  <button className="btn-action" onClick={handleCopy}>Copy</button>
                  <button className="btn-action" onClick={handleDownload}>Save</button>
                </div>
              </div>
              <div className="editor-body">
                <div className="line-numbers" ref={outputGutter}>
                  {Array.from({ length: outLines }, (_, i) => (
                    <div key={i} className="line-number-item">{i + 1}</div>
                  ))}
                </div>
                <pre className="code-display" onScroll={syncOutputScroll}>
                  <code>{formattedCode || '// Click "Format" or press Ctrl+Enter'}</code>
                </pre>
              </div>
            </section>
          </main>

          {/* Status Bar */}
          <footer className="status-bar">
            <span className="status-badge-success">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Formatted successfully
            </span>
            <span className="status-separator">•</span>
            <span className="status-item">Lexer: <strong>{metrics.lexerStatus}</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Parser: <strong>{metrics.parserStatus}</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Comments preserved: <strong>{metrics.commentsPreserved}</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Indent: <strong>{INDENT_SIZE} {indentStyle}</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Max line: <strong>{maxLine}</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Time: <strong>{metrics.executionTimeMs}ms</strong></span>
            <span className="status-separator">•</span>
            <span className="status-item">Lines: <strong>{metrics.originalLines} → {metrics.formattedLines}</strong></span>
          </footer>

          {/* Error Banner */}
          {errorInfo && (
            <div className="error-banner">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
              <div>
                <strong>{errorInfo.type}:</strong> {errorInfo.message}
                {errorInfo.suggestion && <code> {errorInfo.suggestion}</code>}
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
